      responses: { '200': { description: Decrypted credential, content: { application/json: { schema: { type: object, required: [username, password], properties: { username: { type: string }, password: { type: string }, extra: { type: [object, 'null'], additionalProperties: { type: string } } } } } } }, '403': { $ref: '#/components/responses/Error' } }
  /vault/extension/pair-code:
    post:
