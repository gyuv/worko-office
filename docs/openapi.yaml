      responses: { '201': { description: Linked, content: { application/json: { schema: { type: object, properties: { documentId: { type: string } } } } } } }
  /registers/{kind}/{id}/receipt.pdf:
    get: { tags: [registers], operationId: registerReceipt, parameters: [{ $ref: '#/components/parameters/RegisterKind' }, { $ref: '#/components/parameters/Id' }], responses: { '200': { description: PDF receipt } } }
  /service-types:
    get:
      tags: [tasks]
      operationId: listServiceTypes
      parameters: [{ name: all, in: query, schema: { type: string, enum: ['true', 'false'] } }]
