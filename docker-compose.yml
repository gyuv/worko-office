services:
  postgres:
    image: postgres:16
    environment: { POSTGRES_USER: worko, POSTGRES_PASSWORD: worko, POSTGRES_DB: worko }
    ports: ["5432:5432"]
    volumes: ["pg:/var/lib/postgresql/data"]
  redis:
    image: redis:7
    ports: ["6379:6379"]
  minio:
    image: minio/minio
    command: server /data --console-address :9001
    environment: { MINIO_ROOT_USER: worko, MINIO_ROOT_PASSWORD: worko-secret }
    ports: ["9000:9000", "9001:9001"]
  mailpit:
    image: axllent/mailpit
    ports: ["1025:1025", "8025:8025"]
volumes: { pg: {} }
