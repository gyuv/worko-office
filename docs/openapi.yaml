openapi: 3.1.0
info:
  title: Worko API
  version: 0.4.0
  description: Contract for web, desktop, Android and the public API. Source of truth for @worko/api-client.
servers: [{ url: /v1 }]
security: [{ bearer: [] }]
tags: [{ name: clients }, { name: vault }, { name: documents }, { name: registers }, { name: auth }, { name: tenancy }, { name: users }, { name: audit }, { name: rules }, { name: sync }, { name: notifications }, { name: system }]
paths:
  /health:
    get: { tags: [system], operationId: health, security: [], responses: { '200': { description: OK, content: { application/json: { schema: { type: object, properties: { status: { type: string }, product: { type: string } } } } } } } }
  /tenants/signup:
    post:
      tags: [tenancy]
      operationId: signup
      security: []
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SignupRequest' } } } }
      responses:
        '201': { description: Firm created, content: { application/json: { schema: { type: object, required: [tenantId, userId], properties: { tenantId: { type: string, format: uuid }, userId: { type: string, format: uuid } } } } } }
        '400': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /auth/login:
    post:
      tags: [auth]
      operationId: login
      security: []
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LoginRequest' } } } }
      responses:
        '200': { $ref: '#/components/responses/Tokens' }
        '401': { description: 'Invalid credentials, or `code: MFA_REQUIRED`', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '429': { $ref: '#/components/responses/Error' }
  /auth/otp/request:
    post:
      tags: [auth]
      operationId: requestOtp
      security: []
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [firm, phone], properties: { firm: { type: string }, phone: { type: string } } } } } }
      responses: { '202': { description: Always accepted (no user enumeration) } }
  /auth/otp/verify:
    post:
      tags: [auth]
      operationId: verifyOtp
      security: []
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [firm, phone, code, device], properties: { firm: { type: string }, phone: { type: string }, code: { type: string, pattern: '^\d{6}$' }, device: { $ref: '#/components/schemas/Device' } } } } } }
      responses: { '200': { $ref: '#/components/responses/Tokens' }, '401': { $ref: '#/components/responses/Error' } }
  /auth/refresh:
    post:
      tags: [auth]
      operationId: refresh
      security: []
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [refreshToken], properties: { refreshToken: { type: string } } } } } }
      responses: { '200': { $ref: '#/components/responses/Tokens' }, '401': { description: 'Expired/reused token, or `code: DEVICE_WIPE`', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } } }
  /auth/logout:
    post: { tags: [auth], operationId: logout, responses: { '204': { description: Session revoked } } }
  /auth/sessions:
    get:
      tags: [auth]
      operationId: listSessions
      responses: { '200': { description: Device sessions, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Session' } } } } } }
  /auth/sessions/{id}/revoke:
    post: { tags: [auth], operationId: revokeSession, parameters: [{ $ref: '#/components/parameters/Id' }], responses: { '204': { description: Revoked }, '403': { $ref: '#/components/responses/Error' } } }
  /auth/sessions/{id}/wipe:
    post: { tags: [auth], operationId: wipeSession, description: Revokes the session and makes the device erase local data on next contact., parameters: [{ $ref: '#/components/parameters/Id' }], responses: { '204': { description: Wipe requested }, '403': { $ref: '#/components/responses/Error' } } }
  /auth/totp/setup:
    post:
      tags: [auth]
      operationId: totpSetup
      responses: { '201': { description: Secret for authenticator app, content: { application/json: { schema: { type: object, required: [secret, otpauthUrl], properties: { secret: { type: string }, otpauthUrl: { type: string } } } } } } }
  /auth/totp/enable:
    post:
      tags: [auth]
      operationId: totpEnable
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [code], properties: { code: { type: string } } } } } }
      responses: { '204': { description: Enabled }, '401': { $ref: '#/components/responses/Error' } }
  /me:
    get:
      tags: [users]
      operationId: me
      responses: { '200': { description: Current user, content: { application/json: { schema: { $ref: '#/components/schemas/Me' } } } } }
  /users:
    get:
      tags: [users]
      operationId: listUsers
      responses: { '200': { description: Staff users, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/User' } } } } }, '403': { $ref: '#/components/responses/Error' } }
    post:
      tags: [users]
      operationId: createUser
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateUserRequest' } } } }
      responses: { '201': { description: Created, content: { application/json: { schema: { type: object, properties: { id: { type: string } } } } } }, '403': { $ref: '#/components/responses/Error' }, '409': { $ref: '#/components/responses/Error' } }
  /roles:
    get:
      tags: [users]
      operationId: listRoles
      responses: { '200': { description: Roles, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Role' } } } } } }
  /audit:
    get:
      tags: [audit]
      operationId: listAudit
      parameters:
        - { name: before, in: query, schema: { type: integer } }
        - { name: limit, in: query, schema: { type: integer, maximum: 500 } }
        - { name: entity, in: query, schema: { type: string } }
      responses: { '200': { description: Newest first, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/AuditEntry' } } } } } }
  /audit/verify:
    get:
      tags: [audit]
      operationId: verifyAudit
      responses: { '200': { description: Hash-chain verification, content: { application/json: { schema: { type: object, required: [ok, checked], properties: { ok: { type: boolean }, checked: { type: integer }, brokenAt: { type: [integer, 'null'] } } } } } } }
  /rules/pack:
    get: { tags: [rules], operationId: getRulePack, responses: { '200': { description: Active rule pack summary } } }
  /rules/preview:
    post:
      tags: [rules]
      operationId: previewSchedule
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PreviewRequest' } } } }
      responses: { '201': { description: Due items }, '400': { $ref: '#/components/responses/Error' } }
  /rules/extension-impact:
    post:
      tags: [rules]
      operationId: extensionImpact
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PreviewRequest' } } } }
      responses: { '201': { description: '{ dueDatesChanged, clientsAffected, changes[] }' } }
  /sync/push:
    post:
      tags: [sync]
      operationId: syncPush
      description: Apply an outbox batch. Each mutation is idempotent by `key`; results are per mutation (one failure never rolls back others).
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [mutations], properties: { mutations: { type: array, maxItems: 200, items: { $ref: '#/components/schemas/Mutation' } } } } } } }
      responses: { '200': { description: Per-mutation results, content: { application/json: { schema: { type: object, required: [results], properties: { results: { type: array, items: { $ref: '#/components/schemas/MutationResult' } } } } } } } }
  /sync/pull:
    get:
      tags: [sync]
      operationId: syncPull
      parameters:
        - { name: since, in: query, schema: { type: integer, minimum: 0 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 1000 } }
      responses: { '200': { description: Changes after the cursor, content: { application/json: { schema: { $ref: '#/components/schemas/PullResponse' } } } } }
  /sync/conflicts:
    get:
      tags: [sync]
      operationId: listConflicts
      responses: { '200': { description: Unresolved conflicts caused by this user's writes, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Conflict' } } } } } }
  /sync/conflicts/{id}/resolve:
    post:
      tags: [sync]
      operationId: resolveConflict
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [restore], properties: { restore: { type: boolean, description: 'true = re-apply the losing value' } } } } } }
      responses: { '204': { description: Resolved } }
  /notifications:
    get:
      tags: [notifications]
      operationId: listNotifications
      parameters:
        - { name: unread, in: query, schema: { type: string, enum: ['true', 'false'] } }
        - { name: limit, in: query, schema: { type: integer, maximum: 200 } }
        - { name: before, in: query, schema: { type: string, format: date-time } }
      responses: { '200': { description: Newest first, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Notification' } } } } } }
  /notifications/unread-count:
    get:
      tags: [notifications]
      operationId: unreadCount
      responses: { '200': { description: Count, content: { application/json: { schema: { type: object, required: [count], properties: { count: { type: integer } } } } } } }
  /notifications/read-all:
    post: { tags: [notifications], operationId: readAllNotifications, responses: { '204': { description: Done } } }
  /notifications/{id}/read:
    post: { tags: [notifications], operationId: readNotification, parameters: [{ $ref: '#/components/parameters/Id' }], responses: { '204': { description: Done }, '404': { $ref: '#/components/responses/Error' } } }
  /notifications/{id}/ack:
    post: { tags: [notifications], operationId: ackNotification, description: Acknowledge (also marks read and stops escalation)., parameters: [{ $ref: '#/components/parameters/Id' }], responses: { '204': { description: Done }, '404': { $ref: '#/components/responses/Error' } } }
  /notifications/{id}/snooze:
    post:
      tags: [notifications]
      operationId: snoozeNotification
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [until], properties: { until: { type: string, format: date-time } } } } } }
      responses: { '204': { description: Done } }
  /notifications/test:
    post:
      tags: [notifications]
      operationId: sendTestNotification
      responses: { '201': { description: Sent to the caller's devices, content: { application/json: { schema: { type: object, properties: { id: { type: string } } } } } } }
  /notifications/prefs:
    get:
      tags: [notifications]
      operationId: getNotificationPrefs
      responses: { '200': { description: Preferences, content: { application/json: { schema: { $ref: '#/components/schemas/NotificationPrefs' } } } } }
    put:
      tags: [notifications]
      operationId: putNotificationPrefs
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/NotificationPrefs' } } } }
      responses: { '204': { description: Saved } }
  /push/subscriptions:
    post:
      tags: [notifications]
      operationId: subscribePush
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [kind, endpoint], properties: { kind: { type: string, enum: [fcm, webpush] }, endpoint: { type: string, description: 'Web Push endpoint URL or FCM registration token' }, keys: { type: object, properties: { p256dh: { type: string }, auth: { type: string } } } } } } } }
      responses: { '201': { description: Registered, content: { application/json: { schema: { type: object, properties: { id: { type: string } } } } } } }
  /push/subscriptions/{id}:
    delete: { tags: [notifications], operationId: unsubscribePush, parameters: [{ $ref: '#/components/parameters/Id' }], responses: { '204': { description: Removed } } }
  /push/vapid-public-key:
    get:
      tags: [notifications]
      operationId: vapidPublicKey
      security: []
      responses: { '200': { description: VAPID key (null when Web Push is not configured), content: { application/json: { schema: { type: object, properties: { key: { type: [string, 'null'] } } } } } } }
  /teams:
    get:
      tags: [users]
      operationId: listTeams
      responses: { '200': { description: Teams, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Team' } } } } } }
    post:
      tags: [users]
      operationId: createTeam
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [name], properties: { name: { type: string }, leadUserId: { type: [string, 'null'] }, branchId: { type: string }, memberIds: { type: array, items: { type: string } } } } } } }
      responses: { '201': { description: Created, content: { application/json: { schema: { type: object, properties: { id: { type: string } } } } } } }
  /teams/{id}/members:
    put:
      tags: [users]
      operationId: setTeamMembers
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [userIds], properties: { userIds: { type: array, items: { type: string } } } } } } }
      responses: { '204': { description: Saved } }
  /auth/step-up:
    post:
      tags: [auth]
      operationId: stepUp
      description: Re-authenticate (password, or authenticator code when 2FA is on) to unlock sensitive actions for 5 minutes on this session.
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { password: { type: string }, totp: { type: string } } } } } }
      responses: { '200': { description: Elevated, content: { application/json: { schema: { type: object, required: [elevatedUntil], properties: { elevatedUntil: { type: string } } } } } }, '401': { $ref: '#/components/responses/Error' } }
  /auth/extension/pair:
    post:
      tags: [auth]
      operationId: pairExtension
      security: []
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [firm, code], properties: { firm: { type: string }, code: { type: string, pattern: '^\d{4}-\d{4}$' } } } } } }
      responses: { '200': { $ref: '#/components/responses/Tokens' }, '401': { $ref: '#/components/responses/Error' } }
  /users/{id}:
    patch:
      tags: [users]
      operationId: updateUser
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { status: { type: string, enum: [active, disabled] }, managerId: { type: [string, 'null'] }, branchId: { type: string }, roleKeys: { type: array, items: { type: string } }, name: { type: string }, phone: { type: [string, 'null'] } } } } } }
      responses: { '204': { description: Saved }, '403': { $ref: '#/components/responses/Error' } }
  /clients:
    get:
      tags: [clients]
      operationId: listClients
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, enum: [active, inactive, prospect] } }
        - { name: groupId, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, maximum: 500 } }
        - { name: offset, in: query, schema: { type: integer } }
      responses: { '200': { description: Clients the caller may see, content: { application/json: { schema: { type: object, required: [total, items], properties: { total: { type: integer }, items: { type: array, items: { $ref: '#/components/schemas/Client' } } } } } } } }
    post:
      tags: [clients]
      operationId: createClient
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ClientCreate' } } } }
      responses: { '201': { $ref: '#/components/responses/Created' }, '400': { $ref: '#/components/responses/Error' }, '409': { $ref: '#/components/responses/Error' } }
  /clients/duplicates:
    post:
      tags: [clients]
      operationId: findDuplicates
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { name: { type: string }, pan: { type: string }, gstin: { type: string }, phone: { type: string }, excludeId: { type: string } } } } } }
      responses: { '200': { description: Visible matches; invisible ones only counted, content: { application/json: { schema: { type: object, required: [matches, hidden], properties: { hidden: { type: integer }, matches: { type: array, items: { type: object, required: [id, name, score], properties: { id: { type: string }, name: { type: string }, pan: { type: [string, 'null'] }, fileNo: { type: [string, 'null'] }, score: { type: number } } } } } } } } } }
  /clients/import/preview:
    post:
      tags: [clients]
      operationId: previewImport
      requestBody: { required: true, content: { multipart/form-data: { schema: { type: object, required: [file], properties: { file: { type: string, format: binary }, mapping: { type: string, description: 'JSON {header: field} overrides' } } } } } }
      responses: { '200': { description: Validated rows (nothing written), content: { application/json: { schema: { $ref: '#/components/schemas/ImportPreview' } } } } }
  /clients/import/commit:
    post:
      tags: [clients]
      operationId: commitImport
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [rows], properties: { rows: { type: array, items: { $ref: '#/components/schemas/ClientCreate' } } } } } } }
      responses: { '200': { description: Result, content: { application/json: { schema: { type: object, required: [created, ids, failed], properties: { created: { type: integer }, ids: { type: array, items: { type: string } }, failed: { type: array, items: { type: object, properties: { index: { type: integer }, error: { type: string } } } } } } } } } }
  /clients/export:
    get:
      tags: [clients]
      operationId: exportClients
      parameters: [{ name: format, in: query, schema: { type: string, enum: [csv, xlsx] } }]
      responses: { '200': { description: File download } }
  /clients/{id}:
    get:
      tags: [clients]
      operationId: getClient
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses: { '200': { description: Client 360, content: { application/json: { schema: { $ref: '#/components/schemas/ClientDetail' } } } }, '404': { $ref: '#/components/responses/Error' } }
    patch:
      tags: [clients]
      operationId: updateClient
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ClientFields' } } } }
      responses: { '204': { description: Saved } }
    delete: { tags: [clients], operationId: deleteClient, parameters: [{ $ref: '#/components/parameters/Id' }], responses: { '204': { description: Deleted } } }
  /clients/{id}/access:
    put:
      tags: [clients]
      operationId: setClientAccess
      description: Who may see the client. Narrowing revokes it from exactly the devices that held it.
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ClientAccess' } } } }
      responses: { '204': { description: Saved }, '403': { $ref: '#/components/responses/Error' } }
  /clients/{id}/merge:
    post:
      tags: [clients]
      operationId: mergeClient
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [intoId], properties: { intoId: { type: string } } } } } }
      responses: { '204': { description: Merged into intoId } }
  /clients/{id}/reveal:
    post:
      tags: [clients]
      operationId: revealClientPii
      description: Requires a recent step-up; audited.
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [field], properties: { field: { type: string, enum: [aadhaar, bankAccounts] } } } } } }
      responses: { '200': { description: Decrypted value, content: { application/json: { schema: { type: object, properties: { value: {} } } } } }, '403': { description: '`code: STEP_UP_REQUIRED`', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } } }
  /clients/{id}/registrations:
    post:
      tags: [clients]
      operationId: addRegistration
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RegistrationIn' } } } }
      responses: { '201': { $ref: '#/components/responses/Created' }, '409': { $ref: '#/components/responses/Error' } }
  /clients/{id}/contacts:
    post:
      tags: [clients]
      operationId: addContact
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ContactIn' } } } }
      responses: { '201': { $ref: '#/components/responses/Created' } }
  /clients/{id}/secrets:
    post:
      tags: [vault]
      operationId: createSecret
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SecretIn' } } } }
      responses: { '201': { $ref: '#/components/responses/Created' } }
  /clients/{id}/document-tree:
    get:
      tags: [documents]
      operationId: documentTree
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses: { '200': { description: FY → category counts, content: { application/json: { schema: { type: array, items: { type: object, required: [fy, category, count], properties: { fy: { type: string }, category: { type: string }, count: { type: integer } } } } } } } }
  /lookup/gstin/{gstin}:
    get:
      tags: [clients]
      operationId: lookupGstin
      parameters: [{ name: gstin, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: Taxpayer details (provider-dependent), content: { application/json: { schema: { $ref: '#/components/schemas/GstinDetails' } } } }, '400': { $ref: '#/components/responses/Error' } }
  /client-groups:
    get:
      tags: [clients]
      operationId: listClientGroups
      responses: { '200': { description: Groups, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ClientGroup' } } } } } }
    post:
      tags: [clients]
      operationId: createClientGroup
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [name], properties: { name: { type: string }, kind: { type: string, enum: [family, group, other] }, parentId: { type: [string, 'null'] }, notes: { type: [string, 'null'] } } } } } }
      responses: { '201': { $ref: '#/components/responses/Created' } }
  /custom-fields:
    get:
      tags: [clients]
      operationId: listCustomFields
      responses: { '200': { description: Custom field definitions, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/CustomField' } } } } } }
    post:
      tags: [clients]
      operationId: createCustomField
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [key, label, type], properties: { key: { type: string }, label: { type: string }, type: { type: string, enum: [text, number, date, select, boolean] }, options: { type: array, items: { type: string } }, required: { type: boolean }, sort: { type: integer } } } } } }
      responses: { '201': { $ref: '#/components/responses/Created' } }
  /vault/secrets:
    get:
      tags: [vault]
      operationId: listSecrets
      parameters:
        - { name: clientId, in: query, schema: { type: string } }
        - { name: portal, in: query, schema: { $ref: '#/components/schemas/Portal' } }
        - { name: q, in: query, schema: { type: string } }
      responses: { '200': { description: Metadata only, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Secret' } } } } } }
  /vault/secrets/{id}:
    patch:
      tags: [vault]
      operationId: updateSecret
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SecretPatch' } } } }
      responses: { '204': { description: Saved } }
    delete: { tags: [vault], operationId: deleteSecret, parameters: [{ $ref: '#/components/parameters/Id' }], responses: { '204': { description: Deleted } } }
  /vault/secrets/{id}/reveal:
    post:
      tags: [vault]
      operationId: revealSecret
      description: Requires a recent step-up. Autofill only for the portal's official https host. Audited.
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [purpose], properties: { purpose: { type: string, enum: [view, copy, autofill] }, pageUrl: { type: string } } } } } }
      responses: { '200': { description: Decrypted credential, content: { application/json: { schema: { type: object, required: [username, password], properties: { username: { type: string }, password: { type: string }, extra: { type: [object, 'null'], additionalProperties: { type: string } } } } } } }, '403': { $ref: '#/components/responses/Error' } }
  /vault/extension/pair-code:
    post:
      tags: [vault]
      operationId: extensionPairCode
      responses: { '201': { description: One-time code (5 min), content: { application/json: { schema: { type: object, required: [code, expiresInSeconds], properties: { code: { type: string }, expiresInSeconds: { type: integer } } } } } } }
  /documents:
    get:
      tags: [documents]
      operationId: listDocuments
      parameters:
        - { name: clientId, in: query, schema: { type: string } }
        - { name: fy, in: query, schema: { type: string } }
        - { name: category, in: query, schema: { type: string } }
        - { name: q, in: query, schema: { type: string } }
        - { name: trashed, in: query, schema: { type: string, enum: ['true', 'false'] } }
        - { name: limit, in: query, schema: { type: integer } }
        - { name: offset, in: query, schema: { type: integer } }
      responses: { '200': { description: Documents, content: { application/json: { schema: { type: object, required: [total, items], properties: { total: { type: integer }, items: { type: array, items: { $ref: '#/components/schemas/Document' } } } } } } } }
    post:
      tags: [documents]
      operationId: uploadDocument
      description: 25 MB max; executables/scripts/HTML refused; virus-scanned. Pass documentId to add a new version.
      requestBody: { required: true, content: { multipart/form-data: { schema: { type: object, required: [file], properties: { file: { type: string, format: binary }, clientId: { type: string }, fy: { type: string }, category: { type: string }, name: { type: string }, tags: { type: string }, permanent: { type: string }, expiresOn: { type: string }, documentId: { type: string }, note: { type: string } } } } } }
      responses: { '201': { description: Stored, content: { application/json: { schema: { type: object, required: [id, version], properties: { id: { type: string }, version: { type: integer } } } } } }, '422': { $ref: '#/components/responses/Error' } }
  /documents/{id}:
    patch:
      tags: [documents]
      operationId: updateDocument
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { name: { type: string }, category: { type: string }, fy: { type: [string, 'null'] }, tags: { type: array, items: { type: string } }, permanent: { type: boolean }, expiresOn: { type: [string, 'null'] }, legalHold: { type: boolean } } } } } }
      responses: { '204': { description: Saved } }
    delete: { tags: [documents], operationId: trashDocument, parameters: [{ $ref: '#/components/parameters/Id' }], responses: { '204': { description: Moved to trash } } }
  /documents/{id}/restore:
    post: { tags: [documents], operationId: restoreDocument, parameters: [{ $ref: '#/components/parameters/Id' }], responses: { '204': { description: Restored } } }
  /documents/{id}/versions:
    get:
      tags: [documents]
      operationId: documentVersions
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses: { '200': { description: Newest first, content: { application/json: { schema: { type: array, items: { type: object, required: [version, size, createdAt], properties: { version: { type: integer }, size: { type: integer }, sha256: { type: string }, mime: { type: string }, note: { type: [string, 'null'] }, uploadedBy: { type: [string, 'null'] }, createdAt: { type: string } } } } } } } }
  /documents/{id}/download-url:
    post:
      tags: [documents]
      operationId: documentDownloadUrl
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody: { content: { application/json: { schema: { type: object, properties: { version: { type: integer } } } } } }
      responses: { '200': { description: Signed URL valid 2 minutes, content: { application/json: { schema: { type: object, required: [url, expiresInSeconds], properties: { url: { type: string }, expiresInSeconds: { type: integer } } } } } } }
  /documents/{id}/access-log:
    get:
      tags: [documents]
      operationId: documentAccessLog
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses: { '200': { description: Newest first, content: { application/json: { schema: { type: array, items: { type: object, required: [at, action], properties: { at: { type: string }, action: { type: string }, ip: { type: [string, 'null'] }, userName: { type: [string, 'null'] }, shareLinkId: { type: [string, 'null'] } } } } } } } }
  /documents/{id}/shares:
    get:
      tags: [documents]
      operationId: listShares
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses: { '200': { description: Share links, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ShareLink' } } } } } }
    post:
      tags: [documents]
      operationId: createShare
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [expiresInHours], properties: { expiresInHours: { type: integer, maximum: 720 }, password: { type: string }, maxDownloads: { type: integer } } } } } }
      responses: { '201': { description: Link, content: { application/json: { schema: { type: object, required: [id, url, passwordRequired], properties: { id: { type: string }, url: { type: string }, passwordRequired: { type: boolean } } } } } } }
  /shares/{id}:
    delete: { tags: [documents], operationId: revokeShare, parameters: [{ $ref: '#/components/parameters/Id' }], responses: { '204': { description: Revoked } } }
  /files/{token}:
    get: { tags: [documents], operationId: downloadSigned, security: [], parameters: [{ name: token, in: path, required: true, schema: { type: string } }], responses: { '200': { description: File (attachment) }, '404': { $ref: '#/components/responses/Error' } } }
  /share/{token}:
    get: { tags: [documents], operationId: downloadShare, security: [], parameters: [{ name: token, in: path, required: true, schema: { type: string } }], responses: { '200': { description: File }, '404': { description: 'Unavailable, or `code: PASSWORD_REQUIRED`' } } }
    post:
      tags: [documents]
      operationId: downloadShareWithPassword
      security: []
      parameters: [{ name: token, in: path, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [password], properties: { password: { type: string } } } } } }
      responses: { '200': { description: File }, '404': { $ref: '#/components/responses/Error' } }
  /registers/{kind}:
    get:
      tags: [registers]
      operationId: listRegister
      parameters:
        - { $ref: '#/components/parameters/RegisterKind' }
        - { name: q, in: query, schema: { type: string } }
        - { name: clientId, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: pending, in: query, schema: { type: string, enum: ['true', 'false'] } }
        - { name: limit, in: query, schema: { type: integer } }
        - { name: offset, in: query, schema: { type: integer } }
      responses: { '200': { description: Entries, content: { application/json: { schema: { type: object, required: [total, items], properties: { total: { type: integer }, items: { type: array, items: { $ref: '#/components/schemas/RegisterEntry' } } } } } } } }
    post:
      tags: [registers]
      operationId: createRegisterEntry
      description: Server assigns number (IN|OUT/FY/0001), FY and the recording user.
      parameters: [{ $ref: '#/components/parameters/RegisterKind' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RegisterEntryIn' } } } }
      responses: { '201': { description: Created, content: { application/json: { schema: { type: object, required: [id, number], properties: { id: { type: string }, number: { type: string } } } } } } }
  /registers/{kind}/{id}:
    patch:
      tags: [registers]
      operationId: updateRegisterEntry
      parameters: [{ $ref: '#/components/parameters/RegisterKind' }, { $ref: '#/components/parameters/Id' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RegisterEntryIn' } } } }
      responses: { '204': { description: Saved } }
  /registers/{kind}/{id}/signature:
    post:
      tags: [registers]
      operationId: signRegisterEntry
      parameters: [{ $ref: '#/components/parameters/RegisterKind' }, { $ref: '#/components/parameters/Id' }]
      requestBody: { required: true, content: { multipart/form-data: { schema: { type: object, required: [file], properties: { file: { type: string, format: binary } } } } } }
      responses: { '201': { description: Linked, content: { application/json: { schema: { type: object, properties: { documentId: { type: string } } } } } } }
  /registers/{kind}/{id}/receipt.pdf:
    get: { tags: [registers], operationId: registerReceipt, parameters: [{ $ref: '#/components/parameters/RegisterKind' }, { $ref: '#/components/parameters/Id' }], responses: { '200': { description: PDF receipt } } }
components:
  securitySchemes:
    bearer: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    Id: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    RegisterKind: { name: kind, in: path, required: true, schema: { type: string, enum: [inward, outward] } }
  responses:
    Error: { description: Error, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Tokens: { description: Tokens, content: { application/json: { schema: { $ref: '#/components/schemas/TokenPair' } } } }
    Created: { description: Created, content: { application/json: { schema: { type: object, required: [id], properties: { id: { type: string } } } } } }
  schemas:
    Error:
      type: object
      required: [statusCode, message]
      properties: { statusCode: { type: integer }, message: { type: string }, code: { type: string }, issues: { type: array, items: { type: object } } }
    Device:
      type: object
      required: [platform]
      properties: { platform: { type: string, enum: [web, desktop, android] }, label: { type: string }, deviceId: { type: string } }
    LoginRequest:
      type: object
      required: [firm, email, password, device]
      properties: { firm: { type: string }, email: { type: string, format: email }, password: { type: string }, totp: { type: string }, device: { $ref: '#/components/schemas/Device' } }
    TokenPair:
      type: object
      required: [accessToken, refreshToken, expiresIn, sessionId, userId, tenantId]
      properties: { accessToken: { type: string }, refreshToken: { type: string }, expiresIn: { type: integer }, sessionId: { type: string }, userId: { type: string }, tenantId: { type: string } }
    SignupRequest:
      type: object
      required: [firmName, slug, stateCode, partner]
      properties:
        firmName: { type: string }
        slug: { type: string }
        stateCode: { type: string, pattern: '^\d{2}$' }
        partner: { type: object, required: [name, email, password], properties: { name: { type: string }, email: { type: string }, password: { type: string, minLength: 10 }, phone: { type: string } } }
    Session:
      type: object
      required: [id, platform, current, createdAt]
      properties: { id: { type: string }, platform: { type: string }, label: { type: [string, 'null'] }, ip: { type: [string, 'null'] }, userAgent: { type: [string, 'null'] }, lastSeenAt: { type: [string, 'null'] }, createdAt: { type: string }, revokedAt: { type: [string, 'null'] }, wipeRequestedAt: { type: [string, 'null'] }, current: { type: boolean } }
    Grant:
      type: object
      required: [module, action, scope]
      properties: { module: { type: string }, action: { type: string }, scope: { type: string } }
    Me:
      type: object
      required: [id, name, email, firmName, firmSlug, roles, grants, totpEnabled]
      properties: { id: { type: string }, name: { type: string }, email: { type: string }, phone: { type: [string, 'null'] }, totpEnabled: { type: boolean }, firmName: { type: string }, firmSlug: { type: string }, roles: { type: array, items: { type: string } }, grants: { type: array, items: { $ref: '#/components/schemas/Grant' } } }
    User:
      type: object
      required: [id, name, email, status, roles, totpEnabled]
      properties: { id: { type: string }, name: { type: string }, email: { type: string }, phone: { type: [string, 'null'] }, status: { type: string }, branchId: { type: [string, 'null'] }, totpEnabled: { type: boolean }, roles: { type: array, items: { type: string } } }
    CreateUserRequest:
      type: object
      required: [name, email, password, roleKeys]
      properties: { name: { type: string }, email: { type: string }, phone: { type: string }, password: { type: string, minLength: 10 }, roleKeys: { type: array, items: { type: string } }, branchId: { type: string } }
    Role:
      type: object
      required: [id, key, name, system, grants]
      properties: { id: { type: string }, key: { type: string }, name: { type: string }, system: { type: boolean }, grants: { type: array, items: { $ref: '#/components/schemas/Grant' } }, hiddenFields: { type: array, items: { type: string } } }
    AuditEntry:
      type: object
      required: [seq, at, action, entity]
      properties: { seq: { type: string }, at: { type: string }, action: { type: string }, entity: { type: string }, entityId: { type: [string, 'null'] }, diff: {}, ip: { type: [string, 'null'] }, actorId: { type: [string, 'null'] }, actorName: { type: [string, 'null'] } }
    Mutation:
      type: object
      required: [key, table, id, baseVersion]
      properties: { key: { type: string, description: Idempotency key }, table: { type: string }, id: { type: string, format: uuid }, baseVersion: { type: integer }, patch: { type: object, additionalProperties: true }, delete: { type: boolean } }
    MutationResult:
      type: object
      required: [key, status]
      properties: { key: { type: string }, status: { type: string, enum: [applied, duplicate, rejected_stale, rejected] }, version: { type: integer }, reason: { type: string } }
    Change:
      type: object
      required: [table, id, version, cursor, deleted, fields]
      properties: { table: { type: string }, id: { type: string }, version: { type: integer }, cursor: { type: integer }, deleted: { type: boolean }, fields: { type: object, additionalProperties: true } }
    PullResponse:
      type: object
      required: [changes, cursor, hasMore]
      properties: { changes: { type: array, items: { $ref: '#/components/schemas/Change' } }, cursor: { type: integer }, hasMore: { type: boolean }, scopeKey: { type: string, description: 'Changes when what the user may see changes; clients then re-pull from zero' } }
    Conflict:
      type: object
      required: [id, table, rowId, field, createdAt]
      properties: { id: { type: string }, table: { type: string }, rowId: { type: string }, field: { type: string }, lost: {}, kept: {}, createdAt: { type: string } }
    Notification:
      type: object
      required: [id, category, priority, title, body, fireAt, requiresAck, escalationLevel, version]
      properties: { id: { type: string }, category: { type: string }, priority: { type: string, enum: [low, normal, high, critical] }, title: { type: string }, body: { type: string }, entityType: { type: [string, 'null'] }, entityId: { type: [string, 'null'] }, fireAt: { type: string }, readAt: { type: [string, 'null'] }, ackedAt: { type: [string, 'null'] }, snoozedUntil: { type: [string, 'null'] }, requiresAck: { type: boolean }, escalationLevel: { type: integer }, version: { type: integer } }
    NotificationPrefs:
      type: object
      properties:
        quietHours: { type: ['object', 'null'], properties: { start: { type: string, pattern: '^\d{2}:\d{2}$' }, end: { type: string, pattern: '^\d{2}:\d{2}$' } } }
        categories: { type: object, additionalProperties: { type: object, properties: { push: { type: boolean }, muted: { type: boolean } } } }
        digest: { type: string, enum: ['off', morning, morning_evening] }
    Team:
      type: object
      required: [id, name, memberIds]
      properties: { id: { type: string }, name: { type: string }, branchId: { type: [string, 'null'] }, leadUserId: { type: [string, 'null'] }, memberIds: { type: array, items: { type: string } } }
    EntityType: { type: string, enum: [INDIVIDUAL, PROPRIETORSHIP, PARTNERSHIP, LLP, PRIVATE_COMPANY, PUBLIC_COMPANY, OPC, HUF, TRUST, AOP_BOI, SOCIETY, GOVERNMENT, OTHER] }
    Portal: { type: string, enum: [GST, INCOME_TAX, TRACES, MCA, EPFO, ESIC, BANK, PT, DGFT, OTHER] }
    Address:
      type: object
      required: [line1, city, state, pin]
      properties: { kind: { type: string }, line1: { type: string }, line2: { type: string }, city: { type: string }, state: { type: string }, pin: { type: string } }
    BankAccountIn:
      type: object
      required: [bank, accountNo, ifsc]
      properties: { bank: { type: string }, accountNo: { type: string }, ifsc: { type: string }, holder: { type: string } }
    ClientFields:
      type: object
      properties:
        name: { type: string }
        tradeName: { type: [string, 'null'] }
        fileNo: { type: [string, 'null'] }
        entityType: { $ref: '#/components/schemas/EntityType' }
        pan: { type: [string, 'null'] }
        tan: { type: [string, 'null'] }
        cin: { type: [string, 'null'] }
        udyam: { type: [string, 'null'] }
        iec: { type: [string, 'null'] }
        dob: { type: [string, 'null'], format: date }
        email: { type: [string, 'null'] }
        phone: { type: [string, 'null'] }
        addresses: { type: array, items: { $ref: '#/components/schemas/Address' } }
        source: { type: [string, 'null'] }
        status: { type: string, enum: [active, inactive, prospect] }
        tags: { type: array, items: { type: string } }
        custom: { type: object, additionalProperties: true }
        notes: { type: [string, 'null'] }
        complianceProfile: { type: object, additionalProperties: true }
        aadhaar: { type: [string, 'null'], description: '12 digits; stored encrypted, only last 4 shown' }
        bankAccounts: { type: array, items: { $ref: '#/components/schemas/BankAccountIn' }, description: Stored encrypted; masked in responses }
    ClientAccess:
      type: object
      properties:
        branchId: { type: [string, 'null'] }
        partnerId: { type: [string, 'null'] }
        managerId: { type: [string, 'null'] }
        teamId: { type: [string, 'null'] }
        staffIds: { type: array, items: { type: string } }
        groupIds: { type: array, items: { type: string } }
        sensitive: { type: boolean }
        allowedUserIds: { type: array, items: { type: string } }
    RegistrationIn:
      type: object
      required: [kind, number]
      properties: { kind: { type: string, enum: [GSTIN, TAN, CIN, LLPIN, DIN, UDYAM, IEC, PF, ESI, PT, FSSAI, SHOPS, OTHER] }, number: { type: string }, stateCode: { type: [string, 'null'] }, status: { type: [string, 'null'] }, registeredOn: { type: [string, 'null'] }, isPrimary: { type: boolean } }
    ContactIn:
      type: object
      required: [name]
      properties: { name: { type: string }, role: { type: [string, 'null'] }, email: { type: [string, 'null'] }, phone: { type: [string, 'null'] }, whatsapp: { type: [string, 'null'] }, dob: { type: [string, 'null'] }, anniversary: { type: [string, 'null'] }, isPrimary: { type: boolean } }
    ClientCreate:
      allOf:
        - { $ref: '#/components/schemas/ClientFields' }
        - { $ref: '#/components/schemas/ClientAccess' }
        - type: object
          required: [name, entityType]
          properties: { registrations: { type: array, items: { $ref: '#/components/schemas/RegistrationIn' } }, contacts: { type: array, items: { $ref: '#/components/schemas/ContactIn' } } }
    Client:
      type: object
      required: [id, name, entityType, status, tags, groupIds, staffIds, sensitive, version]
      properties:
        id: { type: string }
        fileNo: { type: [string, 'null'] }
        name: { type: string }
        tradeName: { type: [string, 'null'] }
        entityType: { $ref: '#/components/schemas/EntityType' }
        pan: { type: [string, 'null'] }
        tan: { type: [string, 'null'] }
        cin: { type: [string, 'null'] }
        udyam: { type: [string, 'null'] }
        iec: { type: [string, 'null'] }
        aadhaarLast4: { type: [string, 'null'] }
        bankAccounts: { type: array, items: { type: object, properties: { bank: { type: string }, ifsc: { type: string }, last4: { type: string }, holder: { type: [string, 'null'] } } } }
        dob: { type: [string, 'null'] }
        email: { type: [string, 'null'] }
        phone: { type: [string, 'null'] }
        addresses: { type: array, items: { $ref: '#/components/schemas/Address' } }
        source: { type: [string, 'null'] }
        status: { type: string }
        tags: { type: array, items: { type: string } }
        custom: { type: object, additionalProperties: true }
        notes: { type: [string, 'null'] }
        branchId: { type: [string, 'null'] }
        partnerId: { type: [string, 'null'] }
        managerId: { type: [string, 'null'] }
        teamId: { type: [string, 'null'] }
        staffIds: { type: array, items: { type: string } }
        groupIds: { type: array, items: { type: string } }
        sensitive: { type: boolean }
        allowedUserIds: { type: array, items: { type: string } }
        primaryGstin: { type: [string, 'null'] }
        version: { type: integer }
        createdAt: { type: string }
        updatedAt: { type: string }
    ClientDetail:
      allOf:
        - { $ref: '#/components/schemas/Client' }
        - type: object
          required: [registrations, contacts, groups, counts, can]
          properties:
            registrations: { type: array, items: { type: object, required: [id, kind, number], properties: { id: { type: string }, kind: { type: string }, number: { type: string }, stateCode: { type: [string, 'null'] }, status: { type: [string, 'null'] }, registeredOn: { type: [string, 'null'] }, isPrimary: { type: boolean } } } }
            contacts: { type: array, items: { allOf: [{ $ref: '#/components/schemas/ContactIn' }, { type: object, required: [id], properties: { id: { type: string }, notes: { type: [string, 'null'] } } }] } }
            groups: { type: array, items: { type: object, required: [id, name], properties: { id: { type: string }, name: { type: string }, kind: { type: string } } } }
            counts: { type: object, required: [documents, secrets, inward, outward], properties: { documents: { type: integer }, secrets: { type: integer }, inward: { type: integer }, outward: { type: integer } } }
            can: { type: object, required: [edit, delete, reveal, vault], properties: { edit: { type: boolean }, delete: { type: boolean }, reveal: { type: boolean }, vault: { type: boolean } } }
    GstinDetails:
      type: object
      required: [gstin, legalName, status, stateCode, state, source]
      properties: { gstin: { type: string }, legalName: { type: string }, tradeName: { type: [string, 'null'] }, status: { type: string }, registrationDate: { type: [string, 'null'] }, constitution: { type: [string, 'null'] }, entityType: { type: [string, 'null'] }, stateCode: { type: string }, state: { type: string }, address: { type: [object, 'null'] }, source: { type: string } }
    ClientGroup:
      type: object
      required: [id, name, kind, clientCount]
      properties: { id: { type: string }, name: { type: string }, kind: { type: string }, parentId: { type: [string, 'null'] }, notes: { type: [string, 'null'] }, clientCount: { type: integer } }
    CustomField:
      type: object
      required: [id, key, label, type]
      properties: { id: { type: string }, entity: { type: string }, key: { type: string }, label: { type: string }, type: { type: string }, options: { type: array, items: { type: string } }, required: { type: boolean }, sort: { type: integer } }
    ImportPreview:
      type: object
      required: [headers, mapping, rows, summary]
      properties:
        headers: { type: array, items: { type: string } }
        mapping: { type: object, additionalProperties: { type: string } }
