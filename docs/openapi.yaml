  /automation/rules/{id}/dry-run:
    post: { tags: [automation], operationId: dryRunAutomationRule, description: 'Read-only preview of the saved (or an edited) definition: recent N events or {entityType, entityId}. Zero side effects.', parameters: [{ $ref: '#/components/parameters/Id' }], requestBody: { required: true, content: { application/json: { schema: { type: object } } } }, responses: { '200': { description: OK, content: { application/json: { schema: { type: object } } } }, '400': { $ref: '#/components/responses/Error' }, '404': { $ref: '#/components/responses/Error' } } }
  /automation/agents:
    get: { tags: [automation], operationId: listAutomationAgents, description: 'Prebuilt agents (templates as data) with default parameters and the rule each builds.', responses: { '200': { description: OK, content: { application/json: { schema: { type: object } } } }, '403': { $ref: '#/components/responses/Error' }, '404': { $ref: '#/components/responses/Error' } } }
  /automation/agents/{key}/preview:
    post: { tags: [automation], operationId: previewAutomationAgent, description: 'Dry-run of the agent with the given parameters (firm-wide automation:edit).', parameters: [{ name: key, in: path, required: true, schema: { type: string } }], requestBody: { required: true, content: { application/json: { schema: { type: object } } } }, responses: { '200': { description: OK, content: { application/json: { schema: { type: object } } } }, '400': { $ref: '#/components/responses/Error' }, '403': { $ref: '#/components/responses/Error' }, '404': { $ref: '#/components/responses/Error' } } }
  /automation/agents/{key}/enable:
    post: { tags: [automation], operationId: enableAutomationAgent, description: '"Turn on": instantiates the agent as an enabled firm rule with sensible defaults; returns the rule and a dry-run preview.', parameters: [{ name: key, in: path, required: true, schema: { type: string } }], requestBody: { required: true, content: { application/json: { schema: { type: object } } } }, responses: { '201': { description: OK, content: { application/json: { schema: { type: object } } } }, '400': { $ref: '#/components/responses/Error' }, '403': { $ref: '#/components/responses/Error' }, '404': { $ref: '#/components/responses/Error' } } }
  /automation/runs:
    get: { tags: [automation], operationId: listAutomationRuns, description: 'Run history of visible rules (status, skip reason, step, cost).', parameters: [{ name: ruleId, in: query, schema: { type: string } }, { name: status, in: query, schema: { type: string } }, { name: before, in: query, schema: { type: string } }, { name: limit, in: query, schema: { type: integer } }], responses: { '200': { description: OK, content: { application/json: { schema: { type: object } } } }, '403': { $ref: '#/components/responses/Error' }, '404': { $ref: '#/components/responses/Error' } } }
  /automation/runs/{id}:
    get: { tags: [automation], operationId: getAutomationRun, description: 'Run with per-action results (done/queued/refused/failed/skipped/rate_limited, code, cost).', parameters: [{ $ref: '#/components/parameters/Id' }], responses: { '200': { description: OK, content: { application/json: { schema: { type: object } } } }, '403': { $ref: '#/components/responses/Error' }, '404': { $ref: '#/components/responses/Error' } } }
  /automation/runs/{id}/retry:
    post: { tags: [automation], operationId: retryAutomationRun, description: 'Re-executes the failed actions of a run (manage right).', parameters: [{ $ref: '#/components/parameters/Id' }], responses: { '200': { description: OK, content: { application/json: { schema: { type: object } } } }, '403': { $ref: '#/components/responses/Error' }, '404': { $ref: '#/components/responses/Error' } } }
  /automation/settings:
    get: { tags: [automation], operationId: getAutomationSettings, description: 'Firm kill switch, daily action limit, monthly cost cap, event retention.', responses: { '200': { description: OK, content: { application/json: { schema: { type: object } } } }, '403': { $ref: '#/components/responses/Error' }, '404': { $ref: '#/components/responses/Error' } } }
    put: { tags: [automation], operationId: putAutomationSettings, description: 'Firm-wide settings:edit.', requestBody: { required: true, content: { application/json: { schema: { type: object } } } }, responses: { '200': { description: OK, content: { application/json: { schema: { type: object } } } }, '400': { $ref: '#/components/responses/Error' }, '403': { $ref: '#/components/responses/Error' } } }
  /automation/costs:
    get: { tags: [automation], operationId: getAutomationCosts, description: 'Cost meter per rule for an IST month: messages + AI tokens, against rule and firm caps.', parameters: [{ name: month, in: query, schema: { type: string } }], responses: { '200': { description: OK, content: { application/json: { schema: { type: object } } } }, '403': { $ref: '#/components/responses/Error' }, '404': { $ref: '#/components/responses/Error' } } }
  /ai/settings:
    get: { tags: [ai], operationId: getAiSettings, description: 'settings:view. Opt-in (off by default), per-feature toggles, no-AI mode, caps, retention; provider/model in use.', responses: { '200': { description: OK, content: { application/json: { schema: { type: object } } } }, '403': { $ref: '#/components/responses/Error' }, '404': { $ref: '#/components/responses/Error' } } }
    put: { tags: [ai], operationId: putAiSettings, description: 'Firm-wide settings:edit.', requestBody: { required: true, content: { application/json: { schema: { type: object } } } }, responses: { '200': { description: OK, content: { application/json: { schema: { type: object } } } }, '400': { $ref: '#/components/responses/Error' }, '403': { $ref: '#/components/responses/Error' } } }
  /ai/availability:
    get: { tags: [ai], operationId: getAiAvailability, description: 'ai:view. Effective per-feature gate (ok | no_ai_mode | ai_disabled | feature_disabled) and whether the firm/user budget is used up — no settings detail, cap values or rates. For showing AI buttons.', responses: { '200': { description: OK, content: { application/json: { schema: { type: object } } } }, '403': { $ref: '#/components/responses/Error' } } }
  /ai/usage:
    get: { tags: [ai], operationId: getAiUsage, description: 'settings:view. Tokens and cost (paise) per feature/user/rule for a month.', parameters: [{ name: month, in: query, schema: { type: string } }], responses: { '200': { description: OK, content: { application/json: { schema: { type: object } } } }, '403': { $ref: '#/components/responses/Error' }, '404': { $ref: '#/components/responses/Error' } } }
  /ai/draft-reply:
    post: { tags: [ai], operationId: aiDraftReply, description: 'ai:create + communication:view on the client. Draft reply to a client message or notice → pending suggestion with sources. 403 no_ai_mode|ai_disabled|feature_disabled|ai_cap.', requestBody: { required: true, content: { application/json: { schema: { type: object } } } }, responses: { '201': { description: OK, content: { application/json: { schema: { type: object } } } }, '400': { $ref: '#/components/responses/Error' }, '403': { $ref: '#/components/responses/Error' }, '404': { $ref: '#/components/responses/Error' } } }
  /ai/summaries:
    post: { tags: [ai], operationId: aiSummarise, description: 'ai:create + communication:view. Summary of the client timeline (or one notice) for the 360 view → suggestion.', requestBody: { required: true, content: { application/json: { schema: { type: object } } } }, responses: { '201': { description: OK, content: { application/json: { schema: { type: object } } } }, '403': { $ref: '#/components/responses/Error' }, '404': { $ref: '#/components/responses/Error' }, '409': { $ref: '#/components/responses/Error' } } }
  /ai/classify:
    post: { tags: [ai], operationId: aiClassifyDocument, description: 'ai:create + documents:view. Category/FY suggestion for an upload.', requestBody: { required: true, content: { application/json: { schema: { type: object } } } }, responses: { '201': { description: OK, content: { application/json: { schema: { type: object } } } }, '403': { $ref: '#/components/responses/Error' }, '404': { $ref: '#/components/responses/Error' } } }
  /ai/suggestions:
    get: { tags: [ai], operationId: listSuggestions, description: 'ai:view; suggestions on clients the caller sees in the owning module.', parameters: [{ name: status, in: query, schema: { type: string } }, { name: kind, in: query, schema: { type: string } }, { name: clientId, in: query, schema: { type: string } }, { name: limit, in: query, schema: { type: integer } }], responses: { '200': { description: OK, content: { application/json: { schema: { type: object } } } }, '403': { $ref: '#/components/responses/Error' }, '404': { $ref: '#/components/responses/Error' } } }
  /ai/suggestions/{id}:
    get: { tags: [ai], operationId: getSuggestion, description: 'Payload (decrypted), sources, provider (mock flagged).', parameters: [{ $ref: '#/components/parameters/Id' }], responses: { '200': { description: OK, content: { application/json: { schema: { type: object } } } }, '403': { $ref: '#/components/responses/Error' }, '404': { $ref: '#/components/responses/Error' } } }
  /ai/suggestions/{id}/approve:
    post: { tags: [ai], operationId: approveSuggestion, description: 'Applies through the normal service AS THE APPROVER (same permission as doing it by hand): message via comm (edits allowed; consent/caps apply), summary as a timeline note, classification as document metadata, e-sign as a real request. 409 already_decided|expired.', parameters: [{ $ref: '#/components/parameters/Id' }], requestBody: { required: true, content: { application/json: { schema: { type: object } } } }, responses: { '200': { description: OK, content: { application/json: { schema: { type: object } } } }, '403': { $ref: '#/components/responses/Error' }, '404': { $ref: '#/components/responses/Error' }, '409': { $ref: '#/components/responses/Error' } } }
  /ai/suggestions/{id}/reject:
    post: { tags: [ai], operationId: rejectSuggestion, description: 'Rejects a pending suggestion.', parameters: [{ $ref: '#/components/parameters/Id' }], requestBody: { required: true, content: { application/json: { schema: { type: object } } } }, responses: { '204': { description: Done }, '404': { $ref: '#/components/responses/Error' }, '409': { $ref: '#/components/responses/Error' } } }
components:
  securitySchemes:
    bearer: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    Id: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    ClientId: { name: clientId, in: path, required: true, schema: { type: string, format: uuid } }
    Firm: { name: firm, in: path, required: true, schema: { type: string } }
    Token: { name: token, in: path, required: true, schema: { type: string } }
    RegisterKind: { name: kind, in: path, required: true, schema: { type: string, enum: [inward, outward] } }
  responses:
    Error: { description: Error, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Tokens: { description: Tokens, content: { application/json: { schema: { $ref: '#/components/schemas/TokenPair' } } } }
    Booking: { description: Booked, content: { application/json: { schema: { type: object, properties: { id: { type: string }, startsAt: { type: string }, endsAt: { type: string }, manageToken: { type: string }, manageUrl: { type: string } } } } } }
    PortalTokens: { description: Portal tokens (separate issuer/audience — never valid on staff routes), content: { application/json: { schema: { $ref: '#/components/schemas/PortalTokenPair' } } } }
    Created: { description: Created, content: { application/json: { schema: { type: object, required: [id], properties: { id: { type: string } } } } } }
  schemas:
    PortalGrants:
      type: object
      properties: { documents: { type: object, properties: { enabled: { type: boolean }, categories: { type: array, items: { type: string } }, fys: { type: array, items: { type: string } } } }, invoices: { type: boolean }, payments: { type: boolean }, requests: { type: boolean }, messages: { type: boolean }, esign: { type: boolean }, notices: { type: boolean }, compliance: { type: boolean } }
    PortalSettings:
      type: object
      properties: { displayName: { type: [string, 'null'] }, logoDocumentId: { type: [string, 'null'] }, accent: { type: string, enum: [blue, teal, green, indigo, maroon, slate] }, customDomain: { type: [string, 'null'] }, supportEmail: { type: [string, 'null'] }, supportPhone: { type: [string, 'null'] }, welcomeText: { type: [string, 'null'] }, defaultGrants: { $ref: '#/components/schemas/PortalGrants' } }
    PortalBranding:
      type: object
      properties: { firm: { type: string }, displayName: { type: string }, accent: { type: string }, logoUrl: { type: [string, 'null'] }, customDomain: { type: [string, 'null'] }, supportEmail: { type: [string, 'null'] }, supportPhone: { type: [string, 'null'] }, welcomeText: { type: [string, 'null'] } }
    PortalDocument:
      type: object
      properties: { id: { type: string }, name: { type: string }, category: { type: string }, fy: { type: [string, 'null'] }, mime: { type: string }, size: { type: integer }, currentVersion: { type: integer }, createdAt: { type: string }, fromClient: { type: boolean } }
    PortalTokenPair:
      type: object
      required: [accessToken, refreshToken, expiresIn, sessionId, portalUserId, tenantId]
      properties: { accessToken: { type: string }, refreshToken: { type: string }, expiresIn: { type: integer }, sessionId: { type: string }, portalUserId: { type: string }, tenantId: { type: string } }
    LeadStage: { type: string, enum: [new, contacted, qualified, proposal, won, lost] }
    LeadIn:
      type: object
      properties: { name: { type: string }, company: { type: [string, 'null'] }, email: { type: [string, 'null'] }, phone: { type: [string, 'null'] }, pan: { type: [string, 'null'] }, gstin: { type: [string, 'null'] }, entityType: { type: [string, 'null'] }, stateCode: { type: [string, 'null'] }, source: { type: string, enum: [referral, website, walk_in, campaign, existing_client, booking, other] }, ownerId: { type: [string, 'null'] }, expectedValuePaise: { type: integer }, nextFollowupOn: { type: [string, 'null'], format: date }, notes: { type: [string, 'null'] } }
    Lead:
      type: object
      properties: { id: { type: string }, name: { type: string }, company: { type: [string, 'null'] }, email: { type: [string, 'null'] }, phone: { type: [string, 'null'] }, pan: { type: [string, 'null'] }, gstin: { type: [string, 'null'] }, source: { type: string }, ownerId: { type: [string, 'null'] }, stage: { $ref: '#/components/schemas/LeadStage' }, position: { type: number }, lostReason: { type: [string, 'null'] }, expectedValuePaise: { type: integer }, nextFollowupOn: { type: [string, 'null'] }, clientId: { type: [string, 'null'] }, convertedAt: { type: [string, 'null'] }, duplicates: { $ref: '#/components/schemas/Duplicates' }, activities: { type: array, items: { type: object } }, proposals: { type: array, items: { type: object } } }
    Duplicates:
      type: object
      properties: { clients: { type: array, items: { type: object, properties: { id: { type: string }, name: { type: string }, matchedOn: { type: array, items: { type: string } } } } }, hiddenClients: { type: integer }, leads: { type: array, items: { type: object } } }
    ProposalIn:
      type: object
      properties: { title: { type: string }, entityId: { type: [string, 'null'] }, placeOfSupply: { type: [string, 'null'] }, terms: { type: [string, 'null'] }, validUntil: { type: [string, 'null'], format: date }, lines: { type: array, items: { type: object, required: [frequency], properties: { serviceTypeId: { type: [string, 'null'] }, description: { type: [string, 'null'] }, frequency: { type: string, enum: [one_time, monthly, quarterly, annual] }, qty: { type: number }, feePaise: { type: [integer, 'null'], description: 'Omit to use the rate table' }, gstRate: { type: [number, 'null'] }, discountPaise: { type: integer } } } } }
    Notice:
      type: object
      properties: { id: { type: string }, clientId: { type: string }, clientName: { type: [string, 'null'] }, authority: { type: string }, level: { type: string }, section: { type: [string, 'null'] }, referenceNo: { type: [string, 'null'] }, din: { type: [string, 'null'] }, title: { type: string }, issueDate: { type: [string, 'null'] }, receivedOn: { type: string }, responseDue: { type: [string, 'null'] }, assessmentYear: { type: [string, 'null'] }, financialYear: { type: [string, 'null'] }, demandPaise: { type: integer }, status: { type: string, enum: [received, under_review, drafting, submitted, hearing, closed] }, outcome: { type: [string, 'null'] }, assigneeId: { type: [string, 'null'] }, reviewerId: { type: [string, 'null'] }, taskId: { type: [string, 'null'] }, version: { type: integer }, documents: { type: array, items: { type: object } }, hearings: { type: array, items: { type: object } } }
    NoticeIn:
      type: object
      required: [clientId, authority, title]
      properties: { clientId: { type: string, format: uuid }, authority: { type: string, enum: [income_tax, gst, tds, roc, customs, labour, other] }, level: { type: string }, section: { type: [string, 'null'] }, referenceNo: { type: [string, 'null'] }, din: { type: [string, 'null'] }, title: { type: string }, description: { type: [string, 'null'] }, issueDate: { type: [string, 'null'], format: date }, receivedOn: { type: string, format: date }, responseDue: { type: [string, 'null'], format: date }, assessmentYear: { type: [string, 'null'] }, financialYear: { type: [string, 'null'] }, period: { type: [string, 'null'] }, demandPaise: { type: integer }, assigneeId: { type: [string, 'null'] }, reviewerId: { type: [string, 'null'] }, createTask: { type: boolean }, appealOf: { type: [string, 'null'] } }
    NoticeExtraction:
      type: object
      properties: { id: { type: string }, documentId: { type: string }, provider: { type: string }, status: { type: string, enum: [pending, confirmed, discarded] }, suggestions: { type: array, items: { type: object, properties: { field: { type: string }, value: { type: [string, number] }, confidence: { type: number }, source: { type: string } } } } }
    ExtractionConfirm:
      type: object
      required: [fields]
      properties: { fields: { type: object, additionalProperties: { type: [string, number] } }, title: { type: string }, level: { type: string }, assigneeId: { type: [string, 'null'] }, reviewerId: { type: [string, 'null'] } }
    NoticeAgeing:
      type: object
      properties: { asOf: { type: string }, open: { type: integer }, overdue: { type: integer }, demandPaise: { type: integer }, buckets: { type: array, items: { type: object, properties: { bucket: { type: string }, count: { type: integer }, demandPaise: { type: integer } } } }, byAuthority: { type: array, items: { type: object } } }
    HearingIn:
      type: object
      required: [startsAt]
      properties: { startsAt: { type: string, format: date-time }, endsAt: { type: [string, 'null'], format: date-time }, venue: { type: [string, 'null'] }, virtualLink: { type: [string, 'null'] }, reason: { type: [string, 'null'] } }
    Udin:
      type: object
      properties: { id: { type: string }, clientId: { type: string }, engagementId: { type: [string, 'null'] }, taskId: { type: [string, 'null'] }, udin: { type: string }, documentType: { type: string }, generatedOn: { type: string }, membershipNo: { type: string }, revokedAt: { type: [string, 'null'] } }
    Dsc:
      type: object
      description: Metadata only — there is no PIN/password field.
      properties: { id: { type: string }, clientId: { type: [string, 'null'] }, holderKind: { type: string, enum: [client_contact, staff] }, holderName: { type: string }, dscClass: { type: string }, dscType: { type: string, enum: [sign, encrypt, combo] }, issuer: { type: string }, serialNo: { type: [string, 'null'] }, validFrom: { type: string }, validTo: { type: string }, custody: { type: string, enum: [in_office, with_client, with_staff] }, custodyUserId: { type: [string, 'null'] }, renewalTaskId: { type: [string, 'null'] }, custodyLog: { type: array, items: { type: object } } }
    DscIn:
      type: object
      additionalProperties: false
      required: [holderKind, dscClass, dscType, issuer, validFrom, validTo]
      properties: { clientId: { type: [string, 'null'] }, holderKind: { type: string, enum: [client_contact, staff] }, contactId: { type: [string, 'null'] }, holderUserId: { type: [string, 'null'] }, holderName: { type: [string, 'null'] }, dscClass: { type: string }, dscType: { type: string, enum: [sign, encrypt, combo] }, issuer: { type: string }, serialNo: { type: [string, 'null'] }, validFrom: { type: string, format: date }, validTo: { type: string, format: date }, tokenLabel: { type: [string, 'null'] }, custody: { type: string, enum: [in_office, with_client, with_staff] }, custodyUserId: { type: [string, 'null'] }, notes: { type: [string, 'null'] } }
    CommChannel: { type: string, enum: [email, whatsapp, sms] }
    CommTemplate:
      type: object
      properties: { id: { type: string }, name: { type: string }, channel: { $ref: '#/components/schemas/CommChannel' }, category: { type: string, enum: [transactional, utility, marketing] }, language: { type: string }, subject: { type: [string, 'null'] }, body: { type: string }, variables: { type: array, items: { type: string } }, sensitive: { type: boolean }, status: { type: string, enum: [draft, submitted, approved, rejected] }, providerRef: { type: [string, 'null'] }, rejectionReason: { type: [string, 'null'] }, dltTemplateId: { type: [string, 'null'] }, version: { type: integer } }
    CommTemplateIn:
      type: object
      required: [name, channel, category, body]
      properties: { name: { type: string, pattern: '^[a-z0-9_]{2,60}$' }, channel: { $ref: '#/components/schemas/CommChannel' }, category: { type: string, enum: [transactional, utility, marketing] }, language: { type: string }, subject: { type: [string, 'null'] }, body: { type: string }, sensitive: { type: boolean }, dltTemplateId: { type: [string, 'null'] } }
    Broadcast:
      type: object
      properties: { id: { type: string }, name: { type: string }, channel: { type: string }, templateId: { type: string }, category: { type: string }, filters: { type: object }, scheduledAt: { type: [string, 'null'] }, status: { type: string, enum: [draft, pending_approval, approved, scheduled, sending, completed, cancelled] }, estimate: { type: [object, 'null'] }, spentPaise: { type: integer }, progress: { type: object, properties: { total: { type: integer }, done: { type: integer }, counts: { type: object } } } }
    BroadcastPreview:
      type: object
      properties: { audience: { type: integer }, eligible: { type: integer }, optedOut: { type: integer }, notOptedIn: { type: integer }, noContact: { type: integer }, duplicates: { type: integer }, overCap: { type: integer }, unitPaise: { type: integer }, costPaise: { type: integer }, capWarning: { type: boolean }, needsApproval: { type: boolean }, sample: { type: array, items: { type: object } } }
    TimelinePage:
      type: object
      properties: { clientId: { type: string }, nextBefore: { type: [string, 'null'] }, items: { type: array, items: { type: object, properties: { kind: { type: string, enum: [message, document, invoice, task] }, id: { type: string }, at: { type: string }, channel: { type: [string, 'null'] }, direction: { type: [string, 'null'] }, title: { type: [string, 'null'] }, body: { type: [string, 'null'] }, status: { type: [string, 'null'] }, address: { type: [string, 'null'] }, by: { type: [string, 'null'] }, callMinutes: { type: [integer, 'null'] }, amountPaise: { type: [integer, 'null'] }, broadcastId: { type: [string, 'null'] } } } } }
    ChatMessage:
      type: object
      properties: { id: { type: string }, channelId: { type: string }, authorId: { type: string }, body: { type: string }, mentions: { type: array, items: { type: string } }, attachmentDocIds: { type: array, items: { type: string } }, editedAt: { type: [string, 'null'] }, createdAt: { type: string }, deleted: { type: boolean }, version: { type: integer } }
    CalendarItem:
      type: object
      properties: { invited: { type: boolean }, source: { type: string, enum: [event, task, leave, holiday] }, id: { type: string }, kind: { type: string }, title: { type: string }, startsAt: { type: string }, endsAt: { type: string }, allDay: { type: boolean }, clientId: { type: [string, 'null'] }, clientName: { type: [string, 'null'] }, editable: { type: boolean } }
    CalendarEventIn:
      type: object
      required: [title, startsAt, endsAt]
      properties: { kind: { type: string, enum: [meeting, personal] }, title: { type: string }, description: { type: [string, 'null'] }, location: { type: [string, 'null'] }, startsAt: { type: string, format: date-time }, endsAt: { type: string, format: date-time }, allDay: { type: boolean }, clientId: { type: [string, 'null'] }, attendeeIds: { type: array, items: { type: string } }, busy: { type: boolean } }
    BookingPageIn:
