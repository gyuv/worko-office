      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [key, done], properties: { key: { type: string }, done: { type: boolean } } } } } }
      responses: { '204': { description: Saved } }
  /tasks/{id}/close:
    post:
      tags: [tasks]
      operationId: closeTask
