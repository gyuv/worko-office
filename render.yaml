# Render Blueprint: Worko API + Postgres. Deploy via Render → New → Blueprint → pick this repo.
# The web app stays on Vercel; set VITE_API_URL there to https://<this service>.onrender.com/v1.
# Every start runs migrations and the demo seed (the seed skips a firm that already exists),
# so the `demo` firm (password Demo@12345) is always there.
services:
  - type: web
    name: worko-api
    runtime: node
    plan: free
    region: singapore
    healthCheckPath: /v1/health
    buildCommand: corepack enable && pnpm install --frozen-lockfile --prod=false && pnpm turbo run build --filter=@worko/api...
    startCommand: cd apps/api && pnpm migrate && pnpm seed:demo && pnpm start
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: DATABASE_URL
        fromDatabase: { name: worko-db, property: connectionString }
      - key: JWT_SIGNING_KEY
        generateValue: true
      - key: FIELD_ENCRYPTION_KEY
        generateValue: true
      - key: KMS_LOCAL_MASTER_KEY
        generateValue: true
      # Comma-separated web origins allowed to call the API (your Vercel site).
      - key: CORS_ORIGINS
        value: https://worko-office.vercel.app
      - key: WEB_PUBLIC_URL
        value: https://worko-office.vercel.app
      - key: ALLOW_SIGNUP
        value: "1"
      - key: AI_DISABLED
        value: "1"

databases:
  - name: worko-db
    plan: free
    region: singapore
    databaseName: worko
    user: worko
    postgresMajorVersion: "16"
