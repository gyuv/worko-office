      parameters: [{ $ref: '#/components/parameters/RegisterKind' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RegisterEntryIn' } } } }
      responses: { '201': { description: Created, content: { application/json: { schema: { type: object, required: [id, number], properties: { id: { type: string }, number: { type: string } } } } } } }
  /registers/{kind}/{id}:
    patch:
      tags: [registers]
      operationId: updateRegisterEntry
      parameters: [{ $ref: '#/components/parameters/RegisterKind' }, { $ref: '#/components/parameters/Id' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RegisterEntryIn' } } } }
      responses: { '204': { description: Saved } }
  /registers/{kind}/{id}/signature:
    post:
      tags: [registers]
