      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [expiresInHours], properties: { expiresInHours: { type: integer, maximum: 720 }, password: { type: string }, maxDownloads: { type: integer } } } } } }
      responses: { '201': { description: Link, content: { application/json: { schema: { type: object, required: [id, url, passwordRequired], properties: { id: { type: string }, url: { type: string }, passwordRequired: { type: boolean } } } } } } }
  /shares/{id}:
