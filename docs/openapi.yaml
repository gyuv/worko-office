      responses: { '201': { $ref: '#/components/responses/Created' }, '409': { $ref: '#/components/responses/Error' } }
  /service-types/install-defaults:
    post:
      tags: [tasks]
      operationId: installDefaultServiceTypes
      description: Idempotent — adds catalogue entries (one per rule-pack serviceTypeKey, plus a few non-statutory ones) the firm doesn't have.
      responses: { '200': { description: Result, content: { application/json: { schema: { type: object, required: [created, skipped], properties: { created: { type: integer }, skipped: { type: integer } } } } } } }
  /service-types/{id}:
    patch:
      tags: [tasks]
      operationId: updateServiceType
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ServiceTypeIn' } } } }
      responses: { '204': { description: Saved } }
  /clients/{id}/services:
    get:
      tags: [tasks]
      operationId: listClientServices
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses: { '200': { description: Subscriptions, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ClientService' } } } } }, '404': { $ref: '#/components/responses/Error' } }
  /clients/{id}/services/{serviceTypeId}:
    put:
      tags: [tasks]
      operationId: subscribeClientService
      description: Upsert a client's subscription to a service, with optional people overrides (they must be able to see the client).
      parameters: [{ $ref: '#/components/parameters/Id' }, { name: serviceTypeId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ClientServiceIn' } } } }
      responses: { '200': { description: Saved, content: { application/json: { schema: { type: object, required: [id], properties: { id: { type: string } } } } } } }
  /tasks:
    get:
      tags: [tasks]
      operationId: listTasks
      description: List / kanban / gantt / sprint views all read this. Visible = clients:view on the client AND tasks:view (task people count as owners).
      parameters:
        - { name: status, in: query, description: Comma-separated statuses, schema: { type: string } }
        - { name: assigneeId, in: query, description: "uuid or 'me'", schema: { type: string } }
        - { name: clientId, in: query, schema: { type: string } }
        - { name: serviceTypeId, in: query, schema: { type: string } }
        - { name: dueFrom, in: query, schema: { type: string, format: date } }
        - { name: dueTo, in: query, schema: { type: string, format: date } }
        - { name: dateField, in: query, schema: { type: string, enum: [statutory_due, act_by] } }
        - { name: overdue, in: query, schema: { type: string, enum: ['true', 'false'] } }
        - { name: asOf, in: query, schema: { type: string, format: date } }
        - { name: closed, in: query, schema: { type: string, enum: ['true', 'false'] } }
        - { name: firm, in: query, description: Firm/internal tasks only, schema: { type: string, enum: ['true', 'false'] } }
        - { name: q, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer } }
        - { name: offset, in: query, schema: { type: integer } }
      responses: { '200': { description: Tasks, content: { application/json: { schema: { type: object, required: [total, items], properties: { total: { type: integer }, items: { type: array, items: { $ref: '#/components/schemas/Task' } } } } } } } }
    post:
      tags: [tasks]
      operationId: createTask
      description: Manual task (client or firm). Checks default from the service type.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TaskIn' } } } }
      responses: { '201': { $ref: '#/components/responses/Created' }, '400': { $ref: '#/components/responses/Error' } }
  /tasks/calendar:
    get:
      tags: [tasks]
      operationId: taskCalendar
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
        - { name: field, in: query, schema: { type: string, enum: [statutory_due, act_by] } }
      responses: { '200': { description: Tasks by date, content: { application/json: { schema: { type: object, required: [from, to, field, truncated, days], properties: { from: { type: string }, to: { type: string }, field: { type: string }, truncated: { type: boolean, description: 'True when more than 2000 tasks matched (narrow the range)' }, days: { type: array, items: { type: object, required: [date, count, tasks], properties: { date: { type: string }, count: { type: integer }, tasks: { type: array, items: { $ref: '#/components/schemas/Task' } } } } } } } } } } }
  /tasks/bulk:
    post:
      tags: [tasks]
      operationId: bulkUpdateTasks
      description: Same rules as single edits; failing rows are reported, the rest applied. Returns an undo token valid 10 minutes.
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [ids, patch], properties: { ids: { type: array, items: { type: string, format: uuid } }, patch: { $ref: '#/components/schemas/TaskBulkPatch' } } } } } }
      responses: { '200': { description: Result, content: { application/json: { schema: { type: object, required: [undoToken, applied, failed, expiresInSeconds], properties: { undoToken: { type: [string, 'null'] }, applied: { type: integer }, expiresInSeconds: { type: integer }, failed: { type: array, items: { type: object, properties: { id: { type: string }, reason: { type: string } } } } } } } } } }
  /tasks/bulk/undo:
    post:
      tags: [tasks]
      operationId: undoBulkUpdate
      description: Restores rows still holding the bulk values; rows changed since (stale), no longer permitted (forbidden) or failing rules (invalid) are skipped.
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [undoToken], properties: { undoToken: { type: string, format: uuid } } } } } }
      responses: { '200': { description: Restored, content: { application/json: { schema: { type: object, required: [restored, skipped], properties: { restored: { type: integer }, skipped: { type: array, items: { type: object, required: [id, reason], properties: { id: { type: string }, reason: { type: string, enum: [stale, forbidden, invalid] } } } } } } } } }, '410': { $ref: '#/components/responses/Error' } }
  /tasks/auto/preview:
    post:
      tags: [tasks]
      operationId: previewAutoTasks
      description: Due items whose period ends in `month`, for subscribed clients the caller may create tasks for. Nothing written.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AutoTasksIn' } } } }
      responses: { '200': { description: Plan, content: { application/json: { schema: { type: object, required: [month, toCreate, skipped, items], properties: { month: { type: string }, toCreate: { type: integer }, skipped: { type: integer }, items: { type: array, items: { $ref: '#/components/schemas/PlannedTask' } } } } } } } }
  /tasks/auto/commit:
    post:
      tags: [tasks]
      operationId: commitAutoTasks
      description: Needs tasks:assign too (it assigns people). Creates the previewed tasks idempotently (one per client × service × period; deleted tasks are not recreated).
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AutoTasksIn' } } } }
      responses: { '200': { description: Result, content: { application/json: { schema: { type: object, required: [month, created, skipped, ids], properties: { month: { type: string }, created: { type: integer }, skipped: { type: integer }, ids: { type: array, items: { type: string } } } } } } } }
  /tasks/{id}:
    get:
      tags: [tasks]
      operationId: getTask
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses: { '200': { description: Task, content: { application/json: { schema: { $ref: '#/components/schemas/Task' } } } }, '404': { $ref: '#/components/responses/Error' } }
    patch:
      tags: [tasks]
      operationId: updateTask
      description: "Rule codes (400 `code`): required_checks_pending, reviewer_required, pending_issue_required, act_by_after_due, task_closed, person_cannot_see_task:*."
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TaskIn' } } } }
      responses: { '204': { description: Saved }, '400': { $ref: '#/components/responses/Error' }, '404': { $ref: '#/components/responses/Error' } }
  /tasks/{id}/checks:
    post:
      tags: [tasks]
      operationId: setTaskCheck
