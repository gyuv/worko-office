    post:
      tags: [tasks]
      operationId: createTodoTemplate
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [name, items], properties: { name: { type: string }, items: { type: array, items: { $ref: '#/components/schemas/TodoTemplateItem' } } } } } } }
      responses: { '201': { $ref: '#/components/responses/Created' } }
  /todo-templates/{id}/apply:
    post:
      tags: [tasks]
      operationId: applyTodoTemplate
