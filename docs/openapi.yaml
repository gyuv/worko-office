      requestBody: { required: true, content: { multipart/form-data: { schema: { type: object, required: [file], properties: { file: { type: string, format: binary }, clientId: { type: string }, fy: { type: string }, category: { type: string }, name: { type: string }, tags: { type: string }, permanent: { type: string }, expiresOn: { type: string }, documentId: { type: string }, note: { type: string } } } } } }
      responses: { '201': { description: Stored, content: { application/json: { schema: { type: object, required: [id, version], properties: { id: { type: string }, version: { type: integer } } } } } }, '422': { $ref: '#/components/responses/Error' } }
  /documents/{id}:
    patch:
      tags: [documents]
      operationId: updateDocument
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { name: { type: string }, category: { type: string }, fy: { type: [string, 'null'] }, tags: { type: array, items: { type: string } }, permanent: { type: boolean }, expiresOn: { type: [string, 'null'] }, legalHold: { type: boolean } } } } } }
      responses: { '204': { description: Saved } }
