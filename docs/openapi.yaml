    post:
      tags: [compliance]
      operationId: approveExtension
      description: Needs firm-wide compliance:approve. Moves statutory due (and act-by by the same delta) on affected open tasks only.
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses: { '200': { description: Approved, content: { application/json: { schema: { type: object, required: [tasksMoved], properties: { tasksMoved: { type: integer } } } } } }, '403': { $ref: '#/components/responses/Error' } }
  /compliance/matrix:
    get:
      tags: [compliance]
      operationId: complianceMatrix
      description: Visible clients × rules → due items with task state (not_created, open, done, overdue).
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
        - { name: asOf, in: query, schema: { type: string, format: date } }
        - { name: ruleIds, in: query, schema: { type: string } }
      responses: { '200': { description: Matrix, content: { application/json: { schema: { $ref: '#/components/schemas/ComplianceMatrix' } } } } }
  /compliance/late-fee:
    post:
      tags: [compliance]
      operationId: lateFeeCalculator
      description: INDICATIVE late fee + interest from unverified rate tables (data). Money in paise.
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [ruleId, dueDate, filedOn], properties: { ruleId: { type: string }, dueDate: { type: string, format: date }, filedOn: { type: string, format: date }, taxAmountPaise: { type: integer }, nilReturn: { type: boolean } } } } } }
      responses: { '200': { description: Indicative amounts, content: { application/json: { schema: { $ref: '#/components/schemas/LateFee' } } } } }
  /billing/entities:
    get: { tags: [billing], operationId: listBillingEntities, description: 'Firm entities the firm bills from (billing:view).', responses: { '200': { description: Entities, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/BillingEntity' } } } } } } }
    post: { tags: [billing], operationId: createBillingEntity, description: 'Firm-wide settings:edit.', requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/BillingEntityIn' } } } }, responses: { '201': { $ref: '#/components/responses/Created' }, '400': { $ref: '#/components/responses/Error' } } }
  /billing/entities/{id}:
    patch: { tags: [billing], operationId: updateBillingEntity, description: 'Firm-wide settings:edit. Prefix, state and GSTIN lock once the entity has issued documents (409 entity_locked).', parameters: [{ $ref: '#/components/parameters/Id' }], requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/BillingEntityIn' } } } }, responses: { '204': { description: Updated }, '409': { $ref: '#/components/responses/Error' } } }
  /billing/settings:
    get: { tags: [billing], operationId: getBillingSettings, responses: { '200': { description: Settings, content: { application/json: { schema: { $ref: '#/components/schemas/BillingSettings' } } } } } }
    put: { tags: [billing], operationId: putBillingSettings, description: 'Firm-wide settings:edit. Ladder = follow-up steps (data).', requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/BillingSettings' } } } }, responses: { '204': { description: Saved } } }
  /billing/rates:
    get: { tags: [billing], operationId: listBillingRates, parameters: [{ name: serviceTypeId, in: query, schema: { type: string } }, { name: clientId, in: query, schema: { type: string } }], responses: { '200': { description: Rates, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/BillingRate' } } } } } } }
    post: { tags: [billing], operationId: createBillingRate, description: 'Firm-wide settings:edit. Client override > group override > default; latest effectiveFrom wins.', requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/BillingRateIn' } } } }, responses: { '201': { $ref: '#/components/responses/Created' } } }
  /billing/rates/{id}:
    patch: { tags: [billing], operationId: updateBillingRate, parameters: [{ $ref: '#/components/parameters/Id' }], requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { amountPaise: { type: integer }, effectiveTo: { type: [string, 'null'], format: date }, notes: { type: [string, 'null'] }, deleted: { type: boolean } } } } } }, responses: { '204': { description: Updated } } }
  /billing/tally/ledgers:
    get: { tags: [billing], operationId: listTallyLedgers, responses: { '200': { description: Mapping, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/TallyLedger' } } } } } } }
    put: { tags: [billing], operationId: putTallyLedgers, description: 'Upserts mappings; ledgerName null removes. Firm-wide settings:edit.', requestBody: { required: true, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/TallyLedger' } } } } }, responses: { '204': { description: Saved } } }
  /billing/tally/dry-run:
    post: { tags: [billing], operationId: tallyDryRun, description: 'Firm-wide billing:export. Voucher XML + validation errors; nothing recorded. VERIFY AGAINST OFFICIAL DOCS (Tally XML).', requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TallyExportIn' } } } }, responses: { '200': { description: Dry run, content: { application/json: { schema: { $ref: '#/components/schemas/TallyResult' } } } } } }
  /billing/tally/export:
    post: { tags: [billing], operationId: tallyExport, description: 'Records exported vouchers (sync log); re-export skips them unless force. 400 tally_validation with issues.', requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TallyExportIn' } } } }, responses: { '200': { description: Exported, content: { application/json: { schema: { $ref: '#/components/schemas/TallyResult' } } } }, '400': { $ref: '#/components/responses/Error' } } }
  /billing/invoices:
    get:
      tags: [billing]
      operationId: listInvoices
      parameters:
        - { name: status, in: query, schema: { type: string }, description: comma-separated }
        - { name: kind, in: query, schema: { type: string, enum: [invoice, credit_note, debit_note] } }
        - { name: clientId, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: overdueAsOf, in: query, schema: { type: string, format: date } }
        - { name: q, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer } }
        - { name: offset, in: query, schema: { type: integer } }
      responses: { '200': { description: Page, content: { application/json: { schema: { type: object, required: [total, items], properties: { total: { type: integer }, items: { type: array, items: { $ref: '#/components/schemas/Invoice' } } } } } } } }
    post: { tags: [billing], operationId: createInvoice, description: 'Draft. Taxes computed server-side; linked tasks become billed (409 task_not_billable / task_already_billed).', requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/InvoiceDraftIn' } } } }, responses: { '201': { $ref: '#/components/responses/Created' }, '409': { $ref: '#/components/responses/Error' } } }
  /billing/invoices/export:
    get: { tags: [billing], operationId: exportInvoices, description: 'Invoice register (audited, formula-safe).', parameters: [{ name: format, in: query, schema: { type: string, enum: [csv, xlsx] } }, { name: from, in: query, schema: { type: string, format: date } }, { name: to, in: query, schema: { type: string, format: date } }], responses: { '200': { description: File } } }
  /billing/invoices/{id}:
    get: { tags: [billing], operationId: getInvoice, parameters: [{ $ref: '#/components/parameters/Id' }], responses: { '200': { description: Invoice, content: { application/json: { schema: { $ref: '#/components/schemas/InvoiceDetail' } } } }, '404': { $ref: '#/components/responses/Error' } } }
    patch: { tags: [billing], operationId: updateInvoice, description: 'Drafts only (409 invoice_immutable after issue).', parameters: [{ $ref: '#/components/parameters/Id' }], requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { entityId: { type: [string, 'null'] }, notes: { type: [string, 'null'] }, lines: { type: array, items: { $ref: '#/components/schemas/InvoiceLineIn' } } } } } } }, responses: { '204': { description: Updated }, '409': { $ref: '#/components/responses/Error' } } }
    delete: { tags: [billing], operationId: deleteInvoice, description: 'Drafts only; its tasks become unbilled.', parameters: [{ $ref: '#/components/parameters/Id' }], responses: { '204': { description: Deleted }, '409': { $ref: '#/components/responses/Error' } } }
  /billing/invoices/{id}/issue:
    post: { tags: [billing], operationId: issueInvoice, description: 'Assigns the next gap-free number of the entity × FY series and locks the content.', parameters: [{ $ref: '#/components/parameters/Id' }], requestBody: { required: true, content: { application/json: { schema: { type: object, required: [issueDate], properties: { issueDate: { type: string, format: date }, dueDate: { type: [string, 'null'], format: date } } } } } }, responses: { '200': { description: Issued, content: { application/json: { schema: { type: object, required: [number], properties: { number: { type: string } } } } } }, '409': { $ref: '#/components/responses/Error' } } }
  /billing/invoices/{id}/cancel:
    post: { tags: [billing], operationId: cancelInvoice, description: 'billing:approve. Only issued invoices with nothing settled (409 invoice_settled → use a credit note).', parameters: [{ $ref: '#/components/parameters/Id' }], requestBody: { required: true, content: { application/json: { schema: { type: object, required: [reason], properties: { reason: { type: string } } } } } }, responses: { '204': { description: Cancelled }, '409': { $ref: '#/components/responses/Error' } } }
  /billing/invoices/{id}/notes:
    post: { tags: [billing], operationId: createInvoiceNote, description: 'billing:approve. Credit (≤ balance) or debit note, issued immediately in its own series.', parameters: [{ $ref: '#/components/parameters/Id' }], requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/InvoiceNoteIn' } } } }, responses: { '201': { description: Created, content: { application/json: { schema: { type: object, required: [id, number, totalPaise], properties: { id: { type: string }, number: { type: string }, totalPaise: { type: integer } } } } } }, '409': { $ref: '#/components/responses/Error' } } }
  /billing/invoices/{id}/follow-up:
    post: { tags: [billing], operationId: setInvoiceFollowUp, description: 'Promise-to-pay date and/or pause; follow-ups stop while either applies.', parameters: [{ $ref: '#/components/parameters/Id' }], requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { promiseToPay: { type: [string, 'null'], format: date }, paused: { type: boolean } } } } } }, responses: { '204': { description: Saved } } }
  /billing/invoices/{id}/send:
    post: { tags: [billing], operationId: sendInvoice, description: 'Sends a signed link (never the document) by email/WhatsApp.', parameters: [{ $ref: '#/components/parameters/Id' }], requestBody: { required: true, content: { application/json: { schema: { type: object, required: [channel], properties: { channel: { type: string, enum: [email, whatsapp] } } } } } }, responses: { '200': { description: Sent, content: { application/json: { schema: { type: object, properties: { status: { type: string } } } } } } } }
  /billing/invoices/{id}/payment-link:
    post: { tags: [billing], operationId: createPaymentLink, description: 'Link for the current balance (computed server-side).', parameters: [{ $ref: '#/components/parameters/Id' }], responses: { '201': { description: Link, content: { application/json: { schema: { type: object, required: [id, url, amountPaise, provider], properties: { id: { type: string }, url: { type: string }, amountPaise: { type: integer }, provider: { type: string } } } } } }, '409': { $ref: '#/components/responses/Error' } } }
  /billing/invoices/{id}/pdf:
    get: { tags: [billing], operationId: invoicePdf, parameters: [{ $ref: '#/components/parameters/Id' }], responses: { '200': { description: PDF } } }
  /billing/auto/preview:
    post: { tags: [billing], operationId: previewAutoBilling, description: 'Drafts per client from done-unbilled tasks (completed in the range) priced from the rate tables.', requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AutoBillingIn' } } } }, responses: { '200': { description: Plan, content: { application/json: { schema: { type: object, properties: { invoices: { type: integer }, tasks: { type: integer }, drafts: { type: array, items: { type: object } }, unpriced: { type: array, items: { $ref: '#/components/schemas/UnbilledTask' } } } } } } } } }
  /billing/auto/commit:
    post: { tags: [billing], operationId: commitAutoBilling, description: Idempotent (a task is on at most one live invoice)., requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AutoBillingIn' } } } }, responses: { '200': { description: Result, content: { application/json: { schema: { type: object, required: [created, ids, skipped, unpriced], properties: { created: { type: integer }, ids: { type: array, items: { type: string } }, skipped: { type: integer }, unpriced: { type: integer } } } } } } } }
  /billing/retainers/preview:
    post: { tags: [billing], operationId: previewRetainers, requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AutoTasksIn' } } } }, responses: { '200': { description: Plan, content: { application/json: { schema: { type: object, properties: { month: { type: string }, toCreate: { type: integer }, items: { type: array, items: { type: object } } } } } } } } }
  /billing/retainers/commit:
    post: { tags: [billing], operationId: commitRetainers, description: One draft per subscription × period (idempotent)., requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AutoTasksIn' } } } }, responses: { '200': { description: Result, content: { application/json: { schema: { type: object, properties: { month: { type: string }, created: { type: integer }, ids: { type: array, items: { type: string } }, skipped: { type: integer } } } } } } } }
  /billing/receipts:
    get: { tags: [billing], operationId: listReceipts, parameters: [{ name: clientId, in: query, schema: { type: string } }, { name: from, in: query, schema: { type: string, format: date } }, { name: to, in: query, schema: { type: string, format: date } }, { name: limit, in: query, schema: { type: integer } }, { name: offset, in: query, schema: { type: integer } }], responses: { '200': { description: Page, content: { application/json: { schema: { type: object, required: [total, items], properties: { total: { type: integer }, items: { type: array, items: { $ref: '#/components/schemas/Receipt' } } } } } } } } }
    post: { tags: [billing], operationId: createReceipt, description: 'receipts:create. Allocations omitted = FIFO (TDS first); [] = all advance. Online-only from mobile.', requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ReceiptIn' } } } }, responses: { '201': { description: Recorded, content: { application/json: { schema: { type: object, required: [id, number, allocations], properties: { id: { type: string }, number: { type: string }, allocations: { type: array, items: { $ref: '#/components/schemas/Allocation' } } } } } } } } }
  /billing/receipts/export:
    get: { tags: [billing], operationId: exportReceipts, parameters: [{ name: format, in: query, schema: { type: string, enum: [csv, xlsx] } }, { name: from, in: query, schema: { type: string, format: date } }, { name: to, in: query, schema: { type: string, format: date } }], responses: { '200': { description: File } } }
  /billing/receipts/{id}:
    get: { tags: [billing], operationId: getReceipt, parameters: [{ $ref: '#/components/parameters/Id' }], responses: { '200': { description: Receipt, content: { application/json: { schema: { $ref: '#/components/schemas/Receipt' } } } }, '404': { $ref: '#/components/responses/Error' } } }
  /billing/receipts/{id}/apply:
    post: { tags: [billing], operationId: applyReceipt, description: Applies an advance (FIFO unless allocations given)., parameters: [{ $ref: '#/components/parameters/Id' }], requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { allocations: { type: array, items: { $ref: '#/components/schemas/Allocation' } } } } } } }, responses: { '200': { description: Applied, content: { application/json: { schema: { type: object, properties: { allocations: { type: array, items: { $ref: '#/components/schemas/Allocation' } } } } } } } } }
  /billing/receipts/{id}/pdf:
    get: { tags: [billing], operationId: receiptPdf, parameters: [{ $ref: '#/components/parameters/Id' }], responses: { '200': { description: PDF } } }
  /billing/ageing:
    get: { tags: [billing], operationId: billingAgeing, description: 'Open balances by days past due (notDue, 0-30, 31-60, 61-90, 90+) per visible client; total = Σ client balances.', parameters: [{ name: asOf, in: query, schema: { type: string, format: date } }], responses: { '200': { description: Ageing, content: { application/json: { schema: { $ref: '#/components/schemas/Ageing' } } } } } }
  /billing/unbilled:
    get: { tags: [billing], operationId: unbilledTasks, parameters: [{ name: from, in: query, schema: { type: string, format: date } }, { name: to, in: query, schema: { type: string, format: date } }, { name: clientId, in: query, schema: { type: string } }], responses: { '200': { description: Done tasks with no outcome, content: { application/json: { schema: { type: object, properties: { count: { type: integer }, suggestedTotalPaise: { type: integer }, items: { type: array, items: { $ref: '#/components/schemas/UnbilledTask' } } } } } } } } }
  /billing/clients/{id}/outstanding:
    get: { tags: [billing], operationId: clientOutstanding, parameters: [{ $ref: '#/components/parameters/Id' }], responses: { '200': { description: Outstanding, content: { application/json: { schema: { type: object, required: [clientId, items, outstandingPaise, advancePaise, netPaise], properties: { clientId: { type: string }, items: { type: array, items: { type: object } }, outstandingPaise: { type: integer }, advancePaise: { type: [integer, 'null'], description: 'null without receipts:view' }, creditPaise: { type: integer, description: Unapplied credit-note credit }, netPaise: { type: integer } } } } } } } }
  /billing/follow-ups/run:
    post: { tags: [billing], operationId: runFollowUps, description: 'Firm-wide settings:edit. Runs the ladder for asOf (≤ today IST; the daily job does this at 10:00 IST).', requestBody: { required: true, content: { application/json: { schema: { type: object, required: [asOf], properties: { asOf: { type: string, format: date } } } } } }, responses: { '200': { description: Result, content: { application/json: { schema: { type: object, properties: { sent: { type: integer }, skipped: { type: integer }, escalated: { type: integer } } } } } } } }
  /billing/webhooks/{provider}/{tenantId}:
    post: { tags: [billing], operationId: paymentWebhook, security: [], description: 'Public. HMAC-SHA256 of the raw body (x-razorpay-signature / x-worko-signature); idempotent per provider event id.', parameters: [{ name: provider, in: path, required: true, schema: { type: string, enum: [mock, razorpay] } }, { name: tenantId, in: path, required: true, schema: { type: string, format: uuid } }], requestBody: { required: true, content: { application/json: { schema: { type: object } } } }, responses: { '200': { description: Processed (or duplicate) }, '401': { $ref: '#/components/responses/Error' } } }
  /billing/public/{token}:
    get: { tags: [billing], operationId: publicInvoice, security: [], description: Signed 30-day invoice link sent to clients (PDF)., parameters: [{ name: token, in: path, required: true, schema: { type: string } }], responses: { '200': { description: PDF }, '404': { $ref: '#/components/responses/Error' } } }
components:
  securitySchemes:
    bearer: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    Id: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    RegisterKind: { name: kind, in: path, required: true, schema: { type: string, enum: [inward, outward] } }
  responses:
    Error: { description: Error, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Tokens: { description: Tokens, content: { application/json: { schema: { $ref: '#/components/schemas/TokenPair' } } } }
    Created: { description: Created, content: { application/json: { schema: { type: object, required: [id], properties: { id: { type: string } } } } } }
  schemas:
    Error:
      type: object
      required: [statusCode, message]
      properties: { statusCode: { type: integer }, message: { type: string }, code: { type: string }, issues: { type: array, items: { type: object } } }
    Device:
      type: object
      required: [platform]
      properties: { platform: { type: string, enum: [web, desktop, android] }, label: { type: string }, deviceId: { type: string } }
    LoginRequest:
      type: object
      required: [firm, email, password, device]
      properties: { firm: { type: string }, email: { type: string, format: email }, password: { type: string }, totp: { type: string }, device: { $ref: '#/components/schemas/Device' } }
    TokenPair:
      type: object
      required: [accessToken, refreshToken, expiresIn, sessionId, userId, tenantId]
      properties: { accessToken: { type: string }, refreshToken: { type: string }, expiresIn: { type: integer }, sessionId: { type: string }, userId: { type: string }, tenantId: { type: string } }
    SignupRequest:
      type: object
      required: [firmName, slug, stateCode, partner]
      properties:
        firmName: { type: string }
        slug: { type: string }
        stateCode: { type: string, pattern: '^\d{2}$' }
        partner: { type: object, required: [name, email, password], properties: { name: { type: string }, email: { type: string }, password: { type: string, minLength: 10 }, phone: { type: string } } }
    Session:
      type: object
      required: [id, platform, current, createdAt]
      properties: { id: { type: string }, platform: { type: string }, label: { type: [string, 'null'] }, ip: { type: [string, 'null'] }, userAgent: { type: [string, 'null'] }, lastSeenAt: { type: [string, 'null'] }, createdAt: { type: string }, revokedAt: { type: [string, 'null'] }, wipeRequestedAt: { type: [string, 'null'] }, current: { type: boolean } }
    Grant:
      type: object
      required: [module, action, scope]
      properties: { module: { type: string }, action: { type: string }, scope: { type: string } }
    Me:
      type: object
      required: [id, name, email, firmName, firmSlug, roles, grants, totpEnabled]
      properties: { id: { type: string }, name: { type: string }, email: { type: string }, phone: { type: [string, 'null'] }, totpEnabled: { type: boolean }, firmName: { type: string }, firmSlug: { type: string }, roles: { type: array, items: { type: string } }, grants: { type: array, items: { $ref: '#/components/schemas/Grant' } } }
    User:
      type: object
      required: [id, name, email, status, roles, totpEnabled]
      properties: { id: { type: string }, name: { type: string }, email: { type: string }, phone: { type: [string, 'null'] }, status: { type: string }, branchId: { type: [string, 'null'] }, totpEnabled: { type: boolean }, roles: { type: array, items: { type: string } } }
    CreateUserRequest:
      type: object
      required: [name, email, password, roleKeys]
      properties: { name: { type: string }, email: { type: string }, phone: { type: string }, password: { type: string, minLength: 10 }, roleKeys: { type: array, items: { type: string } }, branchId: { type: string } }
    Role:
      type: object
      required: [id, key, name, system, grants]
      properties: { id: { type: string }, key: { type: string }, name: { type: string }, system: { type: boolean }, grants: { type: array, items: { $ref: '#/components/schemas/Grant' } }, hiddenFields: { type: array, items: { type: string } } }
    AuditEntry:
      type: object
      required: [seq, at, action, entity]
      properties: { seq: { type: string }, at: { type: string }, action: { type: string }, entity: { type: string }, entityId: { type: [string, 'null'] }, diff: {}, ip: { type: [string, 'null'] }, actorId: { type: [string, 'null'] }, actorName: { type: [string, 'null'] } }
    Mutation:
      type: object
      required: [key, table, id, baseVersion]
      properties: { key: { type: string, description: Idempotency key }, table: { type: string }, id: { type: string, format: uuid }, baseVersion: { type: integer }, patch: { type: object, additionalProperties: true }, delete: { type: boolean } }
    MutationResult:
      type: object
      required: [key, status]
      properties: { key: { type: string }, status: { type: string, enum: [applied, duplicate, rejected_stale, rejected] }, version: { type: integer }, reason: { type: string } }
    Change:
      type: object
      required: [table, id, version, cursor, deleted, fields]
      properties: { table: { type: string }, id: { type: string }, version: { type: integer }, cursor: { type: integer }, deleted: { type: boolean }, fields: { type: object, additionalProperties: true } }
    PullResponse:
      type: object
      required: [changes, cursor, hasMore]
