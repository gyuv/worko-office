      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [outcome], properties: { outcome: { type: string, enum: [billed, free, deleted] }, note: { type: [string, 'null'] } } } } } }
      responses: { '204': { description: Closed }, '400': { $ref: '#/components/responses/Error' } }
  /todos:
    get:
      tags: [tasks]
      operationId: listTodos
