name: 🐞 Bug report
description: Something isn't working as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for helping make Worko better. Please **never paste passwords, OTPs, API keys or client data** here.
  - type: dropdown
    id: app
    attributes:
      label: Where did it happen?
      options: [Web, Windows app, macOS app, Android app, Client portal, Platform console]
    validations: { required: true }
  - type: input
    id: version
    attributes:
      label: Version
      description: Appearance → About & updates shows it (e.g. 1.2.0).
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
      placeholder: "1. Open Tasks  2. Tick a task in My day  3. …"
    validations: { required: true }
  - type: textarea
    id: shots
    attributes:
      label: Screenshots (optional)
      description: Drag images here. Blur any client names or numbers.
